<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="index.css"></link>
    <script type="module" src="main.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Monoton&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap" rel="stylesheet">
</head>

<body>
    <canvas id="main-canvas"></canvas>
    <div class="in-game-hud">
        <div class="stamina-holder">
            <div class="stamina"></div>
        </div>
    </div>
    <div class="wheel">
        <div class="arc" id="inv0"></div>
        <div class="arc" id="inv1"></div>
        <div class="arc" id="inv2"></div>
        <div class="arc" id="inv3"></div>
        <div class="arc" id="inv4"></div>
        <div class="arc" id="inv5"></div>
        <div class="arc" id="inv6"></div>
        <div class="arc" id="inv7"></div>
    </div>
    <div class="pause-screen">
        <h1 class="pause-text">Paused</h1>
        <h3 class="pause-text2">Press Esc to continue</h3>
    </div>
</body>

</html>
